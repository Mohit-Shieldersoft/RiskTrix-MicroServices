# RiskTrix Microservices Architecture
# Complete Docker Compose with all 12 services, automatic database migrations, and infrastructure

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  # PostgreSQL Database (Shared across all services during transition)
  postgres:
    image: postgres:15-alpine
    container_name: micro-ciso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: risktrix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - micro-ciso-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d risktrix_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis for Event Bus and Caching
  redis:
    image: redis:7-alpine
    container_name: micro-ciso-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - micro-ciso-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # PRIMARY BACKEND SERVICES
  # ============================================================================

  # CISO Dashboard Backend (Port 8000) - Main backend with Alembic migrations
  cisodashboard-backend:
    build:
      context: ./backend/cisodashboard-backend
      dockerfile: Dockerfile
    container_name: cisodashboard-backend
    restart: unless-stopped
    environment:
      # Service Config
      PORT: 8000
      ENVIRONMENT: development

      # Database
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: risktrix_db
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/risktrix_db

      # Redis
      REDIS_URL: redis://redis:6379

      # Security
      SECRET_KEY: your-super-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend/cisodashboard-backend/uploads:/app/uploads
      - ./backend/cisodashboard-backend/logs:/app/logs
      - ./backend/cisodashboard-backend/migrations:/app/migrations
    networks:
      - micro-ciso-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  # Application Service (Port 8001)
  application-service:
    build:
      context: ./backend/application-service
      dockerfile: Dockerfile
    container_name: application-service
    restart: unless-stopped
    environment:
      # Service Config
      PORT: 8001
      ENVIRONMENT: development

      # Database
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: risktrix_db
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/risktrix_db

      # Redis
      REDIS_URL: redis://redis:6379

      # Security
      SECRET_KEY: your-super-secret-key-change-in-production

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    volumes:
      - ./backend/application-service/uploads:/app/uploads
      - ./backend/application-service/logs:/app/logs
    networks:
      - micro-ciso-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Audit Service (Port 8002)
  audit-service:
    build:
