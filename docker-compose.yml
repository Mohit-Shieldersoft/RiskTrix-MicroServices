# Micro-CISO Microservices Architecture
# Phase 7: Docker Compose for Application and Audit Services

services:
  # PostgreSQL Database (Shared during transition)
  postgres:
    image: postgres:15-alpine
    container_name: micro-ciso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: risktrix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - micro-ciso-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - micro-ciso-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d risktrix_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Redis for Event Bus and Caching
  redis:
    image: redis:7-alpine
    container_name: micro-ciso-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - micro-ciso-redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - micro-ciso-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Application Service (Phase 5)
  application-service:
    build:
      context: ./backend/application-service
      dockerfile: Dockerfile
    container_name: application-service
    restart: unless-stopped
    environment:
      # Service Config
      PORT: 8001
      ENVIRONMENT: development

      # Database
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: risktrix_db
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/risktrix_db

      # Redis
      REDIS_URL: redis://redis:6379

      # Security
      SECRET_KEY: your-super-secret-key-change-in-production

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    volumes:
      - ./backend/application-service/uploads:/app/uploads
      - ./backend/application-service/logs:/app/logs
    networks:
      - micro-ciso-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cisodashboard-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Audit Service (Phase 6)
  audit-service:
    build:
      context: ./backend/audit-service
      dockerfile: Dockerfile
    container_name: audit-service
    restart: unless-stopped
    environment:
      # Service Config
      PORT: 8002
      ENVIRONMENT: development

      # Database
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: risktrix_db
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/risktrix_db

      # Redis
      REDIS_URL: redis://redis:6379

      # Security
      SECRET_KEY: your-super-secret-key-change-in-production

      # Logging
      LOG_LEVEL: INFO

      # Email Configuration (for certificate expiry notifications)
      MAIL_ENABLED: "false"
    ports:
      - "8002:8002"
    volumes:
      - ./backend/audit-service/uploads:/app/uploads
      - ./backend/audit-service/logs:/app/logs
    networks:
      - micro-ciso-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cisodashboard-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Monolith Service (Auth, Users, Organizations)
  cisodashboard-backend:
    build:
      context: ./backend/cisodashboard-backend
      dockerfile: Dockerfile
    container_name: cisodashboard-backend
    restart: unless-stopped
    environment:
      # Service Config
      PORT: 8000
      ENVIRONMENT: development

      # Database
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: risktrix_db
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/risktrix_db

      # Redis
      REDIS_URL: redis://redis:6379

      # Security
      SECRET_KEY: your-super-secret-key-change-in-production

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend/cisodashboard-backend/uploads:/app/uploads
      - ./backend/cisodashboard-backend/logs:/app/logs
    networks:
      - micro-ciso-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # API Gateway (Nginx) - Routes frontend requests to microservices
  api-gateway:
    image: nginx:alpine
    container_name: micro-ciso-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - micro-ciso-network
    depends_on:
      cisodashboard-backend:
        condition: service_healthy
      application-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Agent Service (Phase 1 - Endpoint Security)
  agent-service:
    build:
      context: ./backend/agent-service
      dockerfile: Dockerfile
    container_name: agent-service
    restart: unless-stopped
    environment:
      # Service Config
      PORT: 8010
      ENVIRONMENT: development

      # Database
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: risktrix_db
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/risktrix_db

      # Redis
      REDIS_URL: redis://redis:6379

      # Security
      SECRET_KEY: your-super-secret-key-change-in-production

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8010:8010"
    volumes:
      - ./backend/agent-service/logs:/app/logs
    networks:
      - micro-ciso-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Binary Analysis Service (Phase 2 - Endpoint Security)
  binary-analysis-service:
    build:
      context: ./backend/binary-analysis-service
      dockerfile: Dockerfile
    container_name: binary-analysis-service
    restart: unless-stopped
    environment:
      # Service Config
      PORT: 8011
      ENVIRONMENT: development

      # Database
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: risktrix_db
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/risktrix_db

      # Redis
      REDIS_URL: redis://redis:6379

      # Security
      SECRET_KEY: your-super-secret-key-change-in-production

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8011:8011"
    volumes:
      - ./backend/binary-analysis-service/logs:/app/logs
    networks:
      - micro-ciso-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Integrity Service (Phase 3 - Endpoint Security)
  integrity-service:
    build:
      context: ./backend/integrity-service
      dockerfile: Dockerfile
    container_name: integrity-service
    restart: unless-stopped
    environment:
      # Service Config
      PORT: 8012
      ENVIRONMENT: development

      # Database
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: risktrix_db
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/risktrix_db

      # Redis
      REDIS_URL: redis://redis:6379

      # Security
      SECRET_KEY: your-super-secret-key-change-in-production

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8012:8012"
    volumes:
      - ./backend/integrity-service/logs:/app/logs
    networks:
      - micro-ciso-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Threat Intelligence Service (Phase 4 - Endpoint Security)
  threat-intelligence-service:
    build:
      context: ./backend/threat-intelligence-service
      dockerfile: Dockerfile
    container_name: threat-intelligence-service
    restart: unless-stopped
    environment:
      # Service Config
      PORT: 8013
      ENVIRONMENT: development

      # Database
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: risktrix_db
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/risktrix_db

      # Redis
      REDIS_URL: redis://redis:6379

      # Security
      SECRET_KEY: your-super-secret-key-change-in-production

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8013:8013"
    volumes:
      - ./backend/threat-intelligence-service/logs:/app/logs
    networks:
      - micro-ciso-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  micro-ciso-network:
    driver: bridge
    name: micro-ciso-network

volumes:
  micro-ciso-postgres-data:
  micro-ciso-redis-data:
