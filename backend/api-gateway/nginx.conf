events {
    worker_connections 1024;
}

http {
    # Upstream for Application Service
    upstream application-service {
        server application-service:8001;
    }

    # Upstream for Audit Service
    upstream audit-service {
        server audit-service:8002;
    }

    # Upstream for Agent Service
    upstream agent-service {
        server agent-service:8010;
    }

    # Upstream for Binary Analysis Service
    upstream binary-analysis-service {
        server binary-analysis-service:8011;
    }


    # Upstream for Integrity Service
    upstream integrity-service {
        server integrity-service:8012;
    }

    # Upstream for Threat Intelligence Service
    upstream threat-intelligence-service {
        server threat-intelligence-service:8013;
    }

    # API Gateway Server
    server {
        listen 80;
        server_name localhost;

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Client settings
        client_max_body_size 100M;

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Gateway Health Check
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"api-gateway","version":"1.0.0"}\n';
            add_header Content-Type application/json;
        }

        # Application Service Routes
        location /api/v1/applications {
            proxy_pass http://application-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/vulnerabilities {
            proxy_pass http://application-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/reminders {
            proxy_pass http://application-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Audit Service Routes
        location /api/v1/vendors {
            proxy_pass http://audit-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/certificates {
            proxy_pass http://audit-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/exceptions {
            proxy_pass http://audit-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/compliance {
            proxy_pass http://audit-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/assignments {
            proxy_pass http://audit-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/assessments {
            proxy_pass http://audit-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Agent Service Routes
        location /api/v1/agents {
            proxy_pass http://agent-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/endpoints {
            proxy_pass http://agent-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Binary Analysis Service Routes
        location /api/v1/binary {
            proxy_pass http://binary-analysis-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/yara {
            proxy_pass http://binary-analysis-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Integrity Service Routes
        location /api/v1/integrity {
            proxy_pass http://integrity-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Threat Intelligence Service Routes
        location /api/v1/threats {
            proxy_pass http://threat-intelligence-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/cve {
            proxy_pass http://threat-intelligence-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Service Health Checks (for monitoring)
        location /services/application/health {
            proxy_pass http://application-service/health;
            proxy_set_header Host $host;
        }

        location /services/audit/health {
            proxy_pass http://audit-service/health;
            proxy_set_header Host $host;
        }

        # Fallback - return service not found
        location / {
            return 404 '{"error":"Service not found","message":"Please check the API documentation"}\n';
            add_header Content-Type application/json;
        }
    }
}
