server {
    listen 8888;
    server_name localhost;
    
    # Set proper MIME types
    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/wasm wasm;
        image/svg+xml svg svgz;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        font/woff2 woff2;
        font/woff woff;
        font/ttf ttf;
        font/eot eot;
        application/json json;
    }
    
    # Disable caching for development
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";

    # Asset Service - Device bulk upload endpoints must bypass policy-service /devices routing
    location ^~ /api/v1/devices/bulk-upload {
        proxy_pass http://asset-service:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Policy Service - Devices, Groups, Security, Agent, Automation Rules/Executions, Audit Logs, Commands
    location ~ ^/api/v1/(devices|groups|security|agent|rules|executions|audit-logs|commands) {
        proxy_pass http://policy-service:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asset Service - Enrollment & Device stats
    location ~ ^/api/v1/enrollment {
        proxy_pass http://asset-service:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asset Service
    location ~ ^/api/v1/assets {
        proxy_pass http://asset-service:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ticket Service  
    location ~ ^/api/v1/tickets {
        proxy_pass http://ticket-service:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Directory Service
    location ~ ^/api/v1/directory {
        proxy_pass http://directory-service:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Policy Service
    location ~ ^/api/v1/policies {
        proxy_pass http://policy-service:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File Service
    location ~ ^/api/v1/files {
        proxy_pass http://file-service:8007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Notification Service
    location ~ ^/api/v1/notifications {
        proxy_pass http://notification-service:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Queue Service
    location ~ ^/api/v1/queue {
        proxy_pass http://queue-service:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Search Service
    location ~ ^/api/v1/search {
        proxy_pass http://search-service:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application Service (Applications, Vulnerabilities, Dashboard, etc.)
    location ~ ^/api/v1/(applications|vulnerabilities|app-history|dashboard|reminders|eosl|auth) {
        proxy_pass http://application-service:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Audit Service (Vendors, Compliance, TPRM, Certificates, etc.)
    location ~ ^/api/v1/(audit|vendors|vendor-notifications|certificates|exceptions|compliance|assignments|assessments|tprm|audit-reminders) {
        proxy_pass http://audit-service:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Monolith Backend (Users, Organizations, Login)
    location ~ ^/api/v1/(users|organizations|login|register) {
        proxy_pass http://cisodashboard-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catch-all for any other /api/* routes to monolith
    location /api/ {
        proxy_pass http://cisodashboard-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Serve static assets (CSS, JS, images, fonts, etc.)
    location ~ \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|json|ico)$ {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    
    # Serve frontend SPA - fallback to index.html for all other routes
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}