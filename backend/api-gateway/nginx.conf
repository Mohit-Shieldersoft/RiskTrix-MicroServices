events {
    worker_connections 1024;
}

http {
    # Docker Embedded DNS Resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Upstream for CISO Dashboard Backend (Auth & Users)
    upstream cisodashboard-backend {
        server cisodashboard-backend:8000;
    }

    # Upstream for Application Service
    upstream application-service {
        server application-service:8001;
    }

    # Upstream for Audit Service
    upstream audit-service {
        server audit-service:8002;
    }

    # Upstream for Agent Service
    upstream agent-service {
        server agent-service:8010;
    }

    # Upstream for Binary Analysis Service
    upstream binary-analysis-service {
        server binary-analysis-service:8011;
    }


    # Upstream for Integrity Service
    upstream integrity-service {
        server integrity-service:8012;
    }

    # Upstream for Threat Intelligence Service
    upstream threat-intelligence-service {
        server threat-intelligence-service:8013;
    }

    # Upstream for CSPM Service
    upstream cspm-service {
        server cspm-service:8014;
    }

    # Upstream for CIEM Service
    upstream ciem-service {
        server ciem-service:8015;
    }

    # Upstream for K8s Container Service
    upstream k8s-container-service {
        server k8s-container-service:8016;
    }

    # Upstream for Alert & Notification Service
    upstream alert-notification-service {
        server alert-notification-service:8017;
    }

    # Upstream for IP Scanner Service
    upstream ip-scanner-service {
        server ip-scanner-service:8018;
    }


    # API Gateway Server
    server {
        listen 80;
        server_name localhost;

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Client settings
        client_max_body_size 100M;

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Gateway Health Check
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"api-gateway","version":"1.0.0"}\n';
            add_header Content-Type application/json;
        }

        # Auth & Users Routes (cisodashboard-backend)
        location /api/v1/auth/ {
            proxy_pass http://cisodashboard-backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth {
            proxy_pass http://cisodashboard-backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/users/ {
            proxy_pass http://cisodashboard-backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
