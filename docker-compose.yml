    container_name: directory-service
    restart: unless-stopped
    environment:
      PORT: 8005
      ENVIRONMENT: development

      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
