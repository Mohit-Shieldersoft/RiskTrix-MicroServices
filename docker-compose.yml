  # CISO Dashboard Frontend (Port 8888) - React + Vite
  cisodashboard-frontend:
    build:
      context: ./frontend/cisodashboard-frontend
      dockerfile: Dockerfile
    container_name: cisodashboard-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8888
      VITE_API_URL: http://localhost:8000
      VITE_API_BASE_URL: http://cisodashboard-backend:8000
      VITE_APPLICATION_SERVICE_URL: http://application-service:8001
      VITE_AUDIT_SERVICE_URL: http://audit-service:8002
      VITE_ASSET_SERVICE_URL: http://asset-service:8003
      VITE_TICKET_SERVICE_URL: http://ticket-service:8004
      VITE_DIRECTORY_SERVICE_URL: http://directory-service:8005
      VITE_POLICY_SERVICE_URL: http://policy-service:8006
      VITE_FILE_SERVICE_URL: http://file-service:8007
      VITE_NOTIFICATION_SERVICE_URL: http://notification-service:8008
      VITE_QUEUE_SERVICE_URL: http://queue-service:8009
      VITE_SEARCH_SERVICE_URL: http://search-service:8010
    ports:
      - "8888:8888"
    volumes:
      - ./frontend/cisodashboard-frontend/src:/app/src
      - ./frontend/cisodashboard-frontend/public:/app/public
    networks:
      - micro-ciso-network
    depends_on:
      - cisodashboard-backend

  # ============================================================================
  # API GATEWAY
  # ============================================================================

  # API Gateway (Nginx) - Routes requests to microservices
  api-gateway:
    image: nginx:alpine
    container_name: micro-ciso-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - micro-ciso-network
    depends_on:
      - cisodashboard-backend
      - application-service
      - audit-service
      - asset-service
      - ticket-service
      - directory-service
      - policy-service
      - file-service
      - notification-service
      - queue-service
      - search-service
      - cisodashboard-frontend

networks:
  micro-ciso-network:
    driver: bridge
    name: micro-ciso-network

volumes:
  postgres_data:
    name: micro-ciso-postgres-data
  redis_data:
    name: micro-ciso-redis-data
